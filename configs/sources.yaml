    corp_code_cache_hours: 24
  naver_news:
    enabled: true
    priority: 2
    daily_limit_guard: 20000
    request_interval_sec: 0.1
  naver_datalab:
    enabled: true
    priority: 2
  pykrx:
    enabled: true
    priority: 1
  financedatareader:
    enabled: true
    priority: 2
