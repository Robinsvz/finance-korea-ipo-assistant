defaults:
  default_fee: 2000
  default_deposit_rate: 0.5
  equal_allocation_ratio: 0.5
  proportional_allocation_ratio: 0.5
  expected_applicants_count: 300000
  proportional_competition:
    conservative: 2000
    base: 1000
    optimistic: 500
  subscription_units:
    - {upper_bound: 100, unit: 10}
    - {upper_bound: 500, unit: 50}
    - {upper_bound: 1000, unit: 100}
    - {upper_bound: 5000, unit: 500}
    - {upper_bound: 10000, unit: 1000}
    - {upper_bound: 1000000000000, unit: 5000}

brokers:
  한국투자증권:
    aliases: [한투, 한국투자, 한국투자증권(주)]
    default_fee: 2000
    default_deposit_rate: 0.5
    account_open_same_day_subscription: false
  NH투자증권:
