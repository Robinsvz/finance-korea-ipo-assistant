[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "korea-ipo-telegram-bot"
version = "1.2.0"
description = "Point-in-time Korean IPO analysis, Telegram and email alerts, allocation, validation, and realized-outcome tracking."
requires-python = ">=3.9"
dependencies = [
  "alembic>=1.13,<2",
  "APScheduler>=3.10,<4",
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "lxml>=5.0,<7",
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "python-dotenv>=1.0,<2",
  "python-telegram-bot>=21.0,<23",
  "PyYAML>=6.0,<7",
  "SQLAlchemy>=2.0,<3",
  "exchange-calendars>=4.5,<5",
]

[project.optional-dependencies]
market = [
  "finance-datareader>=0.9.90",
  "pykrx>=1.0.48",
]
dev = [
  "ipykernel>=6.29,<7",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "pytest-cov>=5.0",
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
